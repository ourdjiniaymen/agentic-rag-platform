server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA fallback: any path that doesn't match a real file
        # (e.g. /chat/3) falls back to index.html, letting React
        # Router take over client-side instead of nginx 404-ing.
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively - Vite fingerprints
    # filenames on build, so a new deploy naturally gets new URLs.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}